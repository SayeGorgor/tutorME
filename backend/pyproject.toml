[tool.ruff]
target-version = "py314"
line-length = 100
indent-width = 4
extend-exclude = [
  ".venv",
  "venv",
  "__pycache__",
  # Preserve the exact original revision header; Ruff trims its docstring whitespace.
  "alembic/versions/b292ed7c70dc_create_user_table.py",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = false
